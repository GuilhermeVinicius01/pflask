{% include 'dashboard/cabecalho.html' %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Lista Turma</h1>
    <a href="/turma/form" class="btn btn-success">+ Novo</a>
</div>

<div class="row">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Semestre</th>
                <th>Curso</th>
                <th>Professor</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for turma in lista %}
            <tr>
                <td>{{ turma[0] }}</td>
                <td>{{ turma[1] }}</td>
                <td>{{ turma[2] }}</td>
                <td>{{ turma[3] }}</td>
                <td>
                    <a href="/turma/editar/{{ turma[0] }}" class="btn btn-primary btn-sm">Editar</a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center">Nenhuma turma cadastrada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

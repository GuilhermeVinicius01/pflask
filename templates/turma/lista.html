{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista Turma</h1>

<div class="row">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Semestre</th>
                <th>Curso</th>
                <th>Professor</th>
                <th>Ação</th>
            </tr>
        </thead>

            {% for turma in lista %}
            <tr>
                <td>{{ turma[0] }}</td>
                <td>{{ turma[1] }}</td>
                <td>{{ turma[2] }}</td>
                <td>{{ turma[3] }}</td>
                <td>
                    <a href="/turma/editar/{{ turma[0] }}" class="btn btn-primary btn-sm">Editar</a>
                    <a href="/turma/remover/{{ turma[0] }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja remover este registro?');">
                        Remover
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" class="text-center">Nenhuma turma cadastrada.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

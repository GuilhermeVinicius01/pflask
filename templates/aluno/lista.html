{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Lista Alunos</h1>

<div class="row">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>

            {% for aluno in alunos %}
            <tr>
                <td>{{ aluno.id }}</td>
                <td>{{ aluno.nome }}</td>
                <td>{{ aluno.idade }}</td>
                <td>{{ aluno.cidade }}</td>
                <td>
                    <a href="/aluno/editar/{{ aluno.id }}" class="btn btn-primary btn-sm">Editar</a>
                    <a href="/aluno/remover/{{ aluno.id }}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Tem certeza que deseja remover este registro?');">
                        Remover
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center">Nenhum aluno cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

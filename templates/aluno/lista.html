{% include 'dashboard/cabecalho.html' %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Lista Aluno</h1>
    <a href="/aluno/form" class="btn btn-success">+ Novo</a>
</div>

<div class="row">
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            {% for aluno in lista %}
            <tr>
                <td>{{ aluno[0] }}</td>
                <td>{{ aluno[1] }}</td>
                <td>{{ aluno[2] }}</td>
                <td>{{ aluno[3] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">Nenhum registro cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

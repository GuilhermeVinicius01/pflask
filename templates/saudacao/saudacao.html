{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Saudação 2</h1>

{% if nome %}
<div class="alert alert-success">Olá, {{ nome }}! Seja bem-vindo ao sistema.</div>
{% endif %}

<form action="/saudacao2/" method="GET">
    <div class="mb-3">
        <label for="nome" class="form-label">Seu nome</label>
        <input type="text" class="form-control" id="nome" name="nome" value="{{ nome or '' }}" required>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Enviar</button>
        <a href="/saudacao" class="btn btn-secondary">Voltar</a>
    </div>
</form>

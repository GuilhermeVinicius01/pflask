{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Desafio: Formulário de Cadastro</h1>

<form action="/desafio" method="POST">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
    </div>
    <div class="mb-3">
        <label for="data_nascimento" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" required>
    </div>
    <div class="mb-3">
        <label for="cpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="000.000.000-00" required>
    </div>
    <div class="mb-3">
        <label for="nome_mae" class="form-label">Nome da Mãe</label>
        <input type="text" class="form-control" id="nome_mae" name="nome_mae" required>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Enviar</button>
        <a href="/saudacao" class="btn btn-secondary">Voltar</a>
    </div>
</form>

{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Cadastro</h1>

<form action="/desafio" method="POST">

    <div class="mb-3">
        <label for="nome" class="form-label">
            Nome
        </label>

        <input
            type="text"
            name="nome"
            id="nome"
            class="form-control"
            required
        >
    </div>

    <div class="mb-3">
        <label for="data_nascimento" class="form-label">
            Data de Nascimento
        </label>

        <input
            type="date"
            name="data_nascimento"
            id="data_nascimento"
            class="form-control"
            required
        >
    </div>

    <div class="mb-3">
        <label for="cpf" class="form-label">
            CPF
        </label>

        <input
            type="text"
            name="cpf"
            id="cpf"
            class="form-control"
            required
        >
    </div>

    <div class="mb-3">
        <label for="nome_mae" class="form-label">
            Nome da Mãe
        </label>

        <input
            type="text"
            name="nome_mae"
            id="nome_mae"
            class="form-control"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Cadastrar
    </button>

</form>
